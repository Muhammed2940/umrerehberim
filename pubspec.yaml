# Umre Rehberim – yeni sürüm
name: umrerehberim
description: Umre Rehberim
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0   # APK Flutter 3.38 / Dart 3.10.7 ile derlenmiş

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase (sürümler APK'dan kesin olarak okundu)
  firebase_core: ^4.3.0
  firebase_auth: any
  cloud_firestore: ^6.1.1
  firebase_database: ^12.1.1
  firebase_messaging: ^16.1.0
  firebase_crashlytics: ^5.0.6
  cloud_functions: ^6.0.5
  # Diğer paketler (sürüm bilgisi derlenmiş kodda bulunmuyor)
  provider: any
  get: any
  http: any
  intl: any
  shared_preferences: any
  path_provider: any
  url_launcher: any
  permission_handler: any
  geolocator: any
  flutter_background_service: any
  pedometer: any
  fl_chart: any
  flutter_html: any
  flutter_screenutil: any
  fluttertoast: any
  card_swiper: any
  salomon_bottom_bar: any
  flutter_material_color_picker: any
  flutter_islamic_icons: any
  equatable: any
  cupertino_icons: any
  flutter_local_notifications: ^22.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  livekit_client: ^2.13.2
  flutter_foreground_task: ^11.0.3
  flutter_webrtc: ^1.6.3
  dart_jsonwebtoken: ^3.4.1
  # Kur'an sesli okuma (arka plan + bildirim/kilit ekranı kontrolleri)
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  flutter_compass: ^0.8.1
  geocoding: ^5.0.1
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  flutter_tts: ^4.2.5
  # Bireysel kullanıcı Google girişi (v7 API; Android web client id google-services.json → default_web_client_id)
  google_sign_in: 7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  generate: true # çoklu dil: l10n.yaml → lib/l10n/gen
  assets:
    - assets/icons/
    - assets/images/
    - assets/quran/
  fonts:
    # Kur'an metni (OFL 1.1, aliftype/amiri 1.003). Lisans: assets/fonts/amiri_quran/OFL.txt
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran/AmiriQuran.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf
        - asset: assets/fonts/amiri/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/amiri/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/amiri/Amiri-BoldItalic.ttf
          weight: 700
          style: italic

